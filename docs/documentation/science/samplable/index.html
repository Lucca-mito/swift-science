<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>Samplable</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A probability distribution that can be randomly sampled." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>Samplable</li></ul><hgroup><p>Protocol</p><h1>Samplable</h1></hgroup><p>A probability distribution that can be randomly sampled.</p><pre><code>protocol Samplable : ProbabilityDistribution</code></pre></section><h2>Overview</h2><p>Sample one random <a href="../probabilitydistribution/value/index.html"><code>Value</code></a> from the distribution with the <a href="sample()/index.html"><code>sample()</code></a> method, or sample <code>count</code> random values with <a href="sample(count:)/index.html"><code>sample(count:)</code></a>.</p><h2>Conforming to the Samplable protocol</h2><p>Creating a custom probability distribution conforming to <code>Samplable</code> only requires implementing the <a href="sample()/index.html"><code>sample()</code></a> function.</p><aside class="tip"><p class="label">Tip</p><p>All probability distributions conforming to <a href="../closedformquantile/index.html"><code>ClosedFormQuantile</code></a> automatically get a <a href="sample()/index.html"><code>sample()</code></a> implementation that uses <a href="https://en.wikipedia.org/wiki/Inverse_transform_sampling">inverse transform sampling</a>. Distributions that don’t have a closed-form quantile can instead conform to <code>Samplable</code> with a custom sampling function. For example, <a href="../normaldistribution/index.html"><code>NormalDistribution</code></a> conforms to <code>Samplable</code> using the Box–Muller transform.</p></aside><aside class="see"><p class="label">See</p><p>The default <a href="../closedformquantile/sample()/index.html"><code>sample()</code></a> function in <a href="../closedformquantile/index.html"><code>ClosedFormQuantile</code></a>.</p></aside><h2>Topics</h2><h3>Instance Methods</h3><ul><li><a href="sample()/index.html"><code>func sample() -> Self.Value</code></a><p>Generates one random <a href="../probabilitydistribution/value/index.html"><code>Value</code></a> sampled from the probability distribution.</p></li><li><a href="sample(count:)/index.html"><code>func sample(count: Int) -> [Self.Value]</code></a><p>Generates indepenent random <a href="../probabilitydistribution/value/index.html"><code>Value</code></a>s from the probability distribution.</p></li></ul><h2>Relationships</h2><h3>Conforming Types</h3><ul><li><a href="../exponentialdistribution/index.html"><code>ExponentialDistribution</code></a></li><li><a href="../poissondistribution/index.html"><code>PoissonDistribution</code></a></li><li><a href="../normaldistribution/index.html"><code>NormalDistribution</code></a></li><li><a href="../bernoullidistribution/index.html"><code>BernoulliDistribution</code></a></li></ul><h3>Inherits From</h3><ul><li><a href="../probabilitydistribution/index.html"><code>ProbabilityDistribution</code></a></li></ul></article></noscript><div id="app"></div></body></html>
