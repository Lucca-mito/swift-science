<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>MetricSpace</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A type with a notion of distance between values." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>MetricSpace</li></ul><hgroup><p>Protocol</p><h1>MetricSpace</h1></hgroup><p>A type with a notion of distance between values.</p><pre><code>protocol MetricSpace : Equatable</code></pre></section><h2>Overview</h2><p>This is similar to Swift’s <code>Strideable</code> protocol, which represents one-dimensional values with a distance function. This protocol is a more general version of <code>Strideable</code>, allowing values to have any number of dimensions. So <code>MetricSpace</code> includes not only every type conforming to <code>Strideable</code>, such as built-in numeric types, but also multidimensional types such as <code>Complex</code>.</p><aside class="see"><p class="label">See</p><p><a href="https://en.wikipedia.org/wiki/Metric_space">Metric space</a> for a theoretical introduction to metric spaces.</p></aside><h2>Example</h2><pre class="swift"><code>let distance: Double = Complex.distance(between: .i, and: 1)
print(distance == .sqrt(2)) // true
</code></pre><h2>Topics</h2><h3>Associated Types</h3><ul><li><a href="stride/index.html"><code>associatedtype Stride : Comparable, SignedNumeric</code></a><p>A type that represents the distance between two values.</p></li></ul><h3>Type Methods</h3><ul><li><a href="distance(between:and:)/index.html"><code>static func distance(between: Self, and: Self) -> Self.Stride</code></a><p>Returns the distance between two values, expressed as a <a href="stride/index.html"><code>Stride</code></a>.</p></li></ul><h2>Relationships</h2><h3>Conforming Types</h3><ul><li><a href="../swift/uint8/index.html"><code>UInt8</code></a></li><li><a href="../swift/int32/index.html"><code>Int32</code></a></li><li><a href="../swift/int64/index.html"><code>Int64</code></a></li><li><a href="../swift/uint32/index.html"><code>UInt32</code></a></li><li><a href="../complexmodule/complex/index.html"><code>Complex</code></a></li><li><a href="../swift/double/index.html"><code>Double</code></a></li><li><a href="../swift/uint16/index.html"><code>UInt16</code></a></li><li><a href="../swift/int/index.html"><code>Int</code></a></li><li><a href="../swift/uint/index.html"><code>UInt</code></a></li><li><a href="../swift/int8/index.html"><code>Int8</code></a></li><li><a href="../swift/float/index.html"><code>Float</code></a></li><li><a href="../swift/int16/index.html"><code>Int16</code></a></li><li><a href="../swift/uint64/index.html"><code>UInt64</code></a></li></ul><h3>Inherited By</h3><ul><li><a href="../euclidean/index.html"><code>Euclidean</code></a></li></ul></article></noscript><div id="app"></div></body></html>
