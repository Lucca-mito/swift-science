<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>ProbabilityOfTypeIError</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A probability of rejecting a null hypothesis when it is true." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>ProbabilityOfTypeIError</li></ul><hgroup><p>Type Alias</p><h1>ProbabilityOfTypeIError</h1></hgroup><p>A probability of rejecting a null hypothesis when it is true.</p><pre><code>typealias ProbabilityOfTypeIError = Double</code></pre></section><h2>Discussion</h2><p>Used for the <code>level</code> parameter of <a href="../hypothesistest/test(on:atlevel:)/index.html"><code>test(on:atLevel:)</code></a>.</p><ul><li><p>A <code>ProbabilityOfTypeIError</code> of 0 corresponds to <i>never</i> rejecting the null hypothesis, so a test at this level is too strict.</p></li><li><p>A <code>ProbabilityOfTypeIError</code> of 1 corresponds to <i>always</i> rejecting the null hypothesis, so a test at this level is not strict enough.</p></li></ul></article></noscript><div id="app"></div></body></html>
