<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>modes</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The modes of the Poisson distribution." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">PoissonDistribution</a></li><li>modes</li></ul><hgroup><p>Instance Property</p><h1>modes</h1></hgroup><p>The modes of the Poisson distribution.</p><pre><code>var modes: Set&lt;Value> { get }</code></pre></section><h2>Example</h2><p>Suppose that a call center receives an average of 3 calls per minute and that the calls are independent from each other. Then the number of calls per minute follows a Poisson distribution with rate 3:</p><pre class="swift"><code>let callsPerMinute = PoissonDistribution(rate: 3)
</code></pre><p>The most likely numbers of calls per minute are 2 and 3:</p><pre class="swift"><code>print(callsPerMinute.modes) // [2, 3]

// Verifying:
print(callsPerMinute.probability(ofExactly: 0)) // Approximately 0.050
print(callsPerMinute.probability(ofExactly: 1)) // Approximately 0.149
print(callsPerMinute.probability(ofExactly: 2)) // Approximately 0.224 &lt;-- Most likely
print(callsPerMinute.probability(ofExactly: 3)) // Approximately 0.224 &lt;-- Most likely
print(callsPerMinute.probability(ofExactly: 4)) // Approximately 0.168
print(callsPerMinute.probability(ofExactly: 5)) // Approximately 0.101
</code></pre></article></noscript><div id="app"></div></body></html>
