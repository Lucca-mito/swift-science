<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>rate</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The (positive) rate parameter of the Poisson distribution, also known as λ." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">PoissonDistribution</a></li><li>rate</li></ul><hgroup><p>Instance Property</p><h1>rate</h1></hgroup><p>The (positive) rate parameter of the Poisson distribution, also known as λ.</p><pre><code>let rate: Statistic</code></pre></section><h2>Discussion</h2><p>If this Poisson distribution models a counting process, <code>rate</code> represents the rate at which events occur in the process.</p><p>For example, suppose that a call center receives an average of 3 calls per minute and that the calls are independent from each other. Then the number of calls received during any given minute follows a Poisson distribution with <code>rate</code> 3.</p></article></noscript><div id="app"></div></body></html>
