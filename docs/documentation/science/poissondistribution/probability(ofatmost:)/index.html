<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>probability(ofAtMost:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The cumulative distribution function of the distribution." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">PoissonDistribution</a></li><li>probability(ofAtMost:)</li></ul><hgroup><p>Instance Method</p><h1>probability(ofAtMost:)</h1></hgroup><p>The cumulative distribution function of the distribution.</p><pre><code>func probability(ofAtMost value: Self.Value) -> Self.Statistic</code></pre></section><h2>Discussion</h2><aside class="complexity"><p class="label">Complexity</p><p>O(<code>value</code>)</p></aside><p>This is a default implementation of the CDF for discrete distributions with a lower bound. It simply sums <a href="../../probabilitydistribution/probability(ofexactly:)/index.html"><code>probability(ofExactly:)</code></a> from <a href="../min/index.html"><code>min</code></a> to <code>value</code>, so it takes linear time. For this reason, probability distributions are encouraged to override this default implementation with a closed-form solution if one exists.</p></article></noscript><div id="app"></div></body></html>
