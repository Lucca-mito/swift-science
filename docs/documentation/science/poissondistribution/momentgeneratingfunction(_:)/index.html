<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>momentGeneratingFunction(_:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The distribution’s moment-generating function." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">PoissonDistribution</a></li><li>momentGeneratingFunction(_:)</li></ul><hgroup><p>Instance Method</p><h1>momentGeneratingFunction(_:)</h1></hgroup><p>The distribution’s <a href="https://en.wikipedia.org/wiki/Moment-generating_function">moment-generating function</a>.</p><pre><code>func momentGeneratingFunction(_ t: some BinaryInteger) -> Statistic</code></pre></section><h2>Return Value</h2><p>The expected value of <picture><source media="(prefers-color-scheme: light)" srcset="../../../../images/science/exp(xt).svg"><source media="(prefers-color-scheme: dark)" srcset="../../../../images/science/exp(xt)~dark.svg"><img alt="e to the power of X t" decoding="async" loading="lazy"></picture> where 𝑋 is a random variable following the distribution.</p><h2>Usage notes</h2><aside class="precondition"><p class="label">Precondition</p><p><code>t</code> ≥ 0</p></aside><p><code>momentGeneratingFunction(0)</code> is always 1.</p><h2>Example</h2><pre class="swift"><code>let normal = NormalDistribution&lt;Double>.standard
print( normal.momentGeneratingFunction(1) ) // Approximately 1.64872
print( normal.sample(count: 1_000_000).map(Double.exp).mean() ) // Approximately 1.64872
</code></pre><h2>Discussion</h2><p>The moment-generating function is commonly abbreviated as MGF. Every probability distribution that has an MGF has a <i>unique</i> MGF.</p></article></noscript><div id="app"></div></body></html>
