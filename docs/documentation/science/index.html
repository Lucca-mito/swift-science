<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>Swift Science</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A scientific computing package for Swift." name="description"></head><body data-color-scheme="auto"><noscript><article><section><hgroup><p>Framework</p><h1>Swift Science</h1></hgroup><p>A scientific computing package for Swift.</p></section><h2>Topics</h2><h3>Continuous probability distributions</h3><ul><li><a href="normaldistribution/index.html"><code>struct NormalDistribution</code></a><p>A <a href="https://en.wikipedia.org/wiki/Normal_distribution">normal distribution</a>, also known as a Gaussian distribution.</p></li><li><a href="exponentialdistribution/index.html"><code>struct ExponentialDistribution</code></a><p>An <a href="https://en.wikipedia.org/wiki/Exponential_distribution">exponential distribution</a>. In a process where independent events occur at a constant rate, the amount of time between events follows this distribution.</p></li></ul><h3>Discrete probability distributions</h3><ul><li><a href="bernoullidistribution/index.html"><code>struct BernoulliDistribution</code></a><p>The probability distribution of a random variable that’s either 0 or 1.</p></li><li><a href="poissondistribution/index.html"><code>struct PoissonDistribution</code></a><p>A <a href="https://en.wikipedia.org/wiki/Poisson_distribution">Poisson distribution</a>. In a process where independent events occur at a constant rate, the number of events that occur in a unit of time follows this distribution.</p></li></ul><h3>Probability distribution protocols: top-level</h3><ul><li><a href="probabilitydistribution/index.html"><code>protocol ProbabilityDistribution</code></a><p>A distribution of all possible values of a random variable together with their probabilities.</p></li><li><a href="samplable/index.html"><code>protocol Samplable</code></a><p>A probability distribution that can be randomly sampled.</p></li></ul><h3>Probability distribution protocols: by continuity</h3><ul><li><a href="continuousdistribution/index.html"><code>protocol ContinuousDistribution</code></a><p>A <a href="https://en.wikipedia.org/wiki/Probability_distribution#Absolutely_continuous_probability_distribution">continuous probability distribution</a>.</p></li><li><a href="discretedistribution/index.html"><code>protocol DiscreteDistribution</code></a><p>A <a href="https://en.wikipedia.org/wiki/Probability_distribution#Discrete_probability_distribution">discrete probability distribution</a>.</p></li></ul><h3>Probability distribution protocols: by moments</h3><ul><li><a href="distributionwithmean/index.html"><code>protocol DistributionWithMean</code></a><p>A probability distribution that always has a mean.</p></li><li><a href="distributionwithvariance/index.html"><code>protocol DistributionWithVariance</code></a><p>A probability distribution that always has a variance and a standard deviation.</p></li><li><a href="distributionwithmoments/index.html"><code>protocol DistributionWithMoments</code></a><p>A probability distribution for which all <a href="https://en.wikipedia.org/wiki/Moment_(mathematics)">moments</a> are always defined.</p></li></ul><h3>Probability distribution protocols: by quantiles</h3><ul><li><a href="closedformmedian/index.html"><code>protocol ClosedFormMedian</code></a><p>A probability distribution with a closed-form median.</p></li><li><a href="closedformquantile/index.html"><code>protocol ClosedFormQuantile</code></a><p>A probability distribution with a closed-form quantile function.</p></li></ul><h3>Probability distribution protocols: by modality</h3><ul><li><a href="finitemodal/index.html"><code>protocol FiniteModal</code></a><p>A probability distribution with a finite set of modes.</p></li><li><a href="unimodal/index.html"><code>protocol Unimodal</code></a><p>A probability distribution that always has a single mode.</p></li></ul><h3>Probability distribution protocols: by boundedness</h3><ul><li><a href="lowerboundeddistribution/index.html"><code>protocol LowerBoundedDistribution</code></a><p>A probability distribution with a lower bound.</p></li><li><a href="boundeddistribution/index.html"><code>protocol BoundedDistribution</code></a><p>A probability distribution with a lower bound and an upper bound.</p></li><li><a href="boundeddiscretedistribution/index.html"><code>protocol BoundedDiscreteDistribution</code></a><p>A probability distribution over a finite set of values.</p></li></ul><h3>Sample statistics</h3><ul><li><a href="swift/collection/index.html"><code>extension Collection</code></a></li></ul><h3>Hypothesis testing fundamentals</h3><ul><li><a href="hypothesistest/index.html"><code>protocol HypothesisTest</code></a><p>A tool to decide whether there is sufficient evidence to reject a statistical hypothesis.</p></li><li><a href="hypothesistestoutcome/index.html"><code>enum HypothesisTestOutcome</code></a><p>Either <code>reject</code> or <code>failToReject</code> the null hypothesis.</p></li></ul><h3>Probabilities used in hypothesis testing</h3><ul><li><a href="probabilityoftypeierror/index.html"><code>typealias ProbabilityOfTypeIError</code></a><p>A probability of rejecting a null hypothesis when it is true.</p></li><li><a href="swift/double/lowprobability/index.html"><code>static let lowProbability: ProbabilityOfTypeIError</code></a><p>A probability of Type I Error that is commonly accepted as being low.</p></li><li><a href="swift/double/verylowprobability/index.html"><code>static let veryLowProbability: ProbabilityOfTypeIError</code></a><p>A probability of Type I Error that is commonly accepted as being very low.</p></li></ul><h3>Hypothesis tests</h3><ul><li><a href="waldtest/index.html"><code>struct WaldTest</code></a><p>A two-sided hypothesis test using a normally-distributed parameter estimator.</p></li><li><a href="createhypothesistest(teststatistic:criticalvalue:pvalue:)/index.html"><code>func createHypothesisTest&lt;Sample>(testStatistic: (Sample) -> Double, criticalValue: (ProbabilityOfTypeIError, Sample) -> Double, pValue: (Sample) -> ProbabilityOfTypeIError) -> some HypothesisTest
</code></a><p>Creates a single custom <a href="hypothesistest/index.html"><code>HypothesisTest</code></a> without having to declare a new type.</p></li></ul><h3>Metric spaces</h3><ul><li><a href="metricspace/index.html"><code>protocol MetricSpace</code></a><p>A type with a notion of distance between values.</p></li><li><a href="euclidean/index.html"><code>protocol Euclidean</code></a><p>A type whose distance between values is the length of the line segment between them.</p></li></ul><h3>Numerical utilities</h3><ul><li><a href="integerapproximable/index.html"><code>protocol IntegerApproximable</code></a><p>A numeric type that can be approximated from an integer.</p></li></ul><h3>Extended Modules</h3><ul><li><a href="complexmodule/index.html"><code></code></a></li><li><a href="swift/index.html"><code></code></a></li></ul></article></noscript><div id="app"></div></body></html>
