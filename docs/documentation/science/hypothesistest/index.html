<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>HypothesisTest</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A tool to decide whether there is sufficient evidence to reject a statistical hypothesis." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>HypothesisTest</li></ul><hgroup><p>Protocol</p><h1>HypothesisTest</h1></hgroup><p>A tool to decide whether there is sufficient evidence to reject a statistical hypothesis.</p><pre><code>protocol HypothesisTest</code></pre></section><h2>Definitions</h2><p>A <i>statistical hypothesis</i> is a constraint on a population parameter. For example, the parameter could be the population mean and the constraint could be that it’s less than 10.</p><p>The statistical hypothesis being tested is always the <i>null hypothesis</i>. Informally, it represents the “status quo” hypothesis: nothing interesting is going on, the current theory is correct, there are no new effects, etc.</p><p>The null hypothesis is tested against an <i>alternative hypothesis</i>, which states that something interesting or unexpected is happening: the old theory needs to be updated, new previously-unseen effects are present, etc.</p><h2>Example</h2><p>You can run a Wald test if the population parameter of interest to the hypothesis is the population mean (or any other parameter satisfying certain constraints; see <a href="../waldtest/index.html"><code>WaldTest</code></a>). To test whether the population mean equals 0:</p><pre class="swift"><code>WaldTest(doesMeanEqual: 0).test(on: data)
</code></pre><h2>Topics</h2><h3>Associated Types</h3><ul><li><a href="sample/index.html"><code>associatedtype Sample</code></a><p>The type used for sample data.</p></li></ul><h3>Instance Methods</h3><ul><li><a href="criticalvalue(at:for:)/index.html"><code>func criticalValue(at: ProbabilityOfTypeIError, for: Self.Sample) -> Double</code></a><p>Calculates the critical value of the test.</p></li><li><a href="pvalue(for:)/index.html"><code>func pValue(for: Self.Sample) -> ProbabilityOfTypeIError</code></a><p>Runs the hypothesis test on the given <code>sample</code> and reports the p-value</p></li><li><a href="test(on:atlevel:)/index.html"><code>func test(on: Self.Sample, atLevel: ProbabilityOfTypeIError) -> HypothesisTestOutcome</code></a><p>Runs the hypothesis test on the given <code>sample</code> and either <i>rejects</i> or <i>fails to reject</i> the null hypothesis.</p></li><li><a href="teststatistic(_:)/index.html"><code>func testStatistic(Self.Sample) -> Double</code></a><p>A function of the dataset that characterizes a type of hypothesis test.</p></li></ul><h2>Relationships</h2><h3>Conforming Types</h3><ul><li><a href="../waldtest/index.html"><code>WaldTest</code></a></li></ul></article></noscript><div id="app"></div></body></html>
