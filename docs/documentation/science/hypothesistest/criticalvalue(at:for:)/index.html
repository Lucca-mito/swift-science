<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>criticalValue(at:for:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Calculates the critical value of the test." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">HypothesisTest</a></li><li>criticalValue(at:for:)</li></ul><hgroup><p>Instance Method</p><h1>criticalValue(at:for:)</h1></hgroup><p>Calculates the critical value of the test.</p><pre><code>func criticalValue(at level: ProbabilityOfTypeIError, for sample: Self.Sample) -> Double</code></pre></section><h2>Parameters</h2><dl><dt>level</dt><dd><p>The desired <a href="../../probabilityoftypeierror/index.html"><code>ProbabilityOfTypeIError</code></a> for the test.</p></dd><dt>sample</dt><dd><p>The sample data to run the test on. In some tests, such as the <a href="../../waldtest/index.html"><code>WaldTest</code></a>, the <code>criticalValue</code> depends only on the level and ignores this parameter.</p></dd></dl><h2>Return Value</h2><p>The critical value of the test. If the <a href="../teststatistic(_:)/index.html"><code>testStatistic(_:)</code></a> exceeds this value, the null hypothesis is rejected.</p><h2>Discussion</h2><p>You rarely need to use this function directly. Use <a href="../test(on:atlevel:)/index.html"><code>test(on:atLevel:)</code></a> or <a href="../pvalue(for:)/index.html"><code>pValue(for:)</code></a> instead.</p></article></noscript><div id="app"></div></body></html>
