<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>pValue(for:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Runs the hypothesis test on the given `sample` and reports the p-value" name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">HypothesisTest</a></li><li>pValue(for:)</li></ul><hgroup><p>Instance Method</p><h1>pValue(for:)</h1></hgroup><p>Runs the hypothesis test on the given <code>sample</code> and reports the p-value</p><pre><code>func pValue(for sample: Self.Sample) -> ProbabilityOfTypeIError</code></pre></section><h2>Parameters</h2><dl><dt>sample</dt><dd><p>The sample data to run the test on.</p></dd></dl><h2>Return Value</h2><p>The smallest level at which the test rejects the null hypothesis. In other words, it’s the smallest <a href="../../probabilityoftypeierror/index.html"><code>ProbabilityOfTypeIError</code></a> for this test given the <code>sample</code>.</p><h2>Discussion</h2><p>The closer the p-value is to 0, the more confident we can be that the data is incompatible with the null hypothesis.</p></article></noscript><div id="app"></div></body></html>
