<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>test(on:atLevel:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Runs the hypothesis test on the given `sample` and either rejects or fails to reject the null hypothesis." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">HypothesisTest</a></li><li>test(on:atLevel:)</li></ul><hgroup><p>Instance Method</p><h1>test(on:atLevel:)</h1></hgroup><p>Runs the hypothesis test on the given <code>sample</code> and either <i>rejects</i> or <i>fails to reject</i> the null hypothesis.</p><pre><code>func test(on sample: Self.Sample, atLevel level: ProbabilityOfTypeIError = .lowProbability) -> HypothesisTestOutcome</code></pre></section><h2>Parameters</h2><dl><dt>sample</dt><dd><p>The sample data to run the test on.</p></dd><dt>level</dt><dd><p>If the null hypothesis is true, this is the probability that the test rejects it anyway. Denoted by 𝛼 in statistical literature and more accurately known as the <i>test size</i>.</p></dd></dl><h2>Return Value</h2><p>Whether the null hypothesis has been rejected.</p><h2>Discussion</h2><p>To get a p-value, use <a href="../pvalue(for:)/index.html"><code>pValue(for:)</code></a> instead.</p></article></noscript><div id="app"></div></body></html>
