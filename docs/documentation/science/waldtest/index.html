<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>WaldTest</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A two-sided hypothesis test using a normally-distributed parameter estimator." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>WaldTest</li></ul><hgroup><p>Structure</p><h1>WaldTest</h1></hgroup><p>A two-sided hypothesis test using a normally-distributed parameter estimator.</p><pre><code>struct WaldTest&lt;Sample></code></pre></section><h2>Overview</h2><p>Use the Wald test only if the estimator <code>parameterEstimator</code> of the parameter of interest 𝜃 is approximately normally-distributed.</p><p>The Wald test rejects the null hypothesis 𝜃 = 𝜃₀ (for some real number 𝜃₀) on dataset 𝑋 at level 𝛼 if:</p><p><picture><source media="(prefers-color-scheme: light)" srcset="../../../images/science/wald-test-rejection-condition.svg"><source media="(prefers-color-scheme: dark)" srcset="../../../images/science/wald-test-rejection-condition~dark.svg"><img alt="Numerator: parameter estimator minus theta_zero. Denominator: standard error estimator. Take the absolute value of that fraction. Greater than negative capital phi, to the power of negative 1, of alpha over 2." decoding="async" loading="lazy"></picture></p><p>where 𝚽⁻¹ is the standard normal <a href="../normaldistribution/quantile(_:)/index.html"><code>quantile(_:)</code></a> function. See <a href="init(parameterestimator:parametervalueundernullhypothesis:standarderrorestimator:)/index.html"><code>init(parameterEstimator:parameterValueUnderNullHypothesis:standardErrorEstimator:)</code></a> for more information.</p><h2>Wald test of the sample mean</h2><p>For large sample sizes, the population mean is a parameter for which the Wald test is appropriate. Its estimator, the sample mean, is approximately normally-distributed (for large sample sizes) by the <a href="https://en.wikipedia.org/wiki/Central_limit_theorem">central limit theorem</a>.</p><p>For small sample sizes, the effects of the central limit theorem are not significant — that is, the sample mean does not necessarily follow an approximate normal distribution — so the Wald test is not appropriate.</p><p>If the Wald test is appropriate, you can use <a href="init(doesmeanequal:)/index.html"><code>init(doesMeanEqual:)</code></a> to create a Wald test of the population mean.</p><h2>Examples</h2><p>Computing the p-value for whether a population mean equals 𝜋:</p><pre class="swift"><code>WaldTest(doesMeanEqual: .pi).pValue(for: sample)
</code></pre><p>Testing whether two populations <code>x</code> and <code>y</code> have the same mean:</p><pre class="swift"><code>WaldTest.sameMean.test(on: (x, y))
</code></pre><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(doesmeanequal:)/index.html"><code>init(doesMeanEqual: Double)</code></a><p>Creates a Wald test for whether a population mean equals the specified value.</p></li><li><a href="init(parameterestimator:parametervalueundernullhypothesis:standarderrorestimator:)/index.html"><code>init(parameterEstimator: (Sample) -> Double, parameterValueUnderNullHypothesis: Double, standardErrorEstimator: (Sample) -> Double)</code></a><p>Creates any Wald test. There are convenience wrappers around this initializer for specific types of Wald test, such as <a href="init(doesmeanequal:)/index.html"><code>init(doesMeanEqual:)</code></a>.</p></li></ul><h3>Instance Methods</h3><ul><li><a href="criticalvalue(at:)/index.html"><code>func criticalValue(at: ProbabilityOfTypeIError) -> Double</code></a><p>Critical value of the Wald test. Depends only on the level, and not on the sample size.</p></li><li><a href="criticalvalue(at:for:)/index.html"><code>func criticalValue(at: ProbabilityOfTypeIError, for: Sample) -> Double</code></a><p>Calculates the critical value of the test.</p></li><li><a href="pvalue(for:)/index.html"><code>func pValue(for: Sample) -> ProbabilityOfTypeIError</code></a><p>Runs the Wald test on the given <code>data</code> and reports the p-value.</p></li><li><a href="teststatistic(_:)/index.html"><code>func testStatistic(Sample) -> Double</code></a><p>The Wald test statistic.</p></li></ul><h3>Type Properties</h3><ul><li><a href="samemean/index.html"><code>static let sameMean: WaldTest&lt;(Array&lt;Double>, Array&lt;Double>)></code></a><p>A Wald test for whether the two populations have the same mean.</p></li></ul><h2>Relationships</h2><h3>Conforms To</h3><ul><li><a href="../hypothesistest/index.html"><code>HypothesisTest</code></a></li></ul></article></noscript><div id="app"></div></body></html>
