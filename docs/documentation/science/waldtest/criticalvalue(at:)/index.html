<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>criticalValue(at:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Critical value of the Wald test. Depends only on the level, and not on the sample size." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">WaldTest</a></li><li>criticalValue(at:)</li></ul><hgroup><p>Instance Method</p><h1>criticalValue(at:)</h1></hgroup><p>Critical value of the Wald test. Depends only on the level, and not on the sample size.</p><pre><code>func criticalValue(at level: ProbabilityOfTypeIError) -> Double</code></pre></section><h2>Parameters</h2><dl><dt>level</dt><dd><p>The desired probability of rejecting the null hypothesis if it’s true.</p></dd></dl><h2>Return Value</h2><p>The critical value: <picture><source media="(prefers-color-scheme: light)" srcset="../../../../images/science/wald-test-critical-value.svg"><source media="(prefers-color-scheme: dark)" srcset="../../../../images/science/wald-test-critical-value~dark.svg"><img alt="Capital phi to the power of negative 1, of level over 2." decoding="async" loading="lazy"></picture> where 𝚽⁻¹ is the standard normal <a href="../../normaldistribution/quantile(_:)/index.html"><code>quantile(_:)</code></a> function.</p><h2>Discussion</h2><p>The second parameter is ignored, and is present solely because <a href="../../hypothesistest/index.html"><code>HypothesisTest</code></a> requires it. Regardless, you rarely need to use this function directly; use <a href="../test(on:atlevel:)/index.html"><code>test(on:atLevel:)</code></a> or <a href="../pvalue(for:)/index.html"><code>pValue(for:)</code></a> instead.</p></article></noscript><div id="app"></div></body></html>
