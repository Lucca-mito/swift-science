<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>init(parameterEstimator:parameterValueUnderNullHypothesis:standardErrorEstimator:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Creates any Wald test. There are convenience wrappers around this initializer for specific types of Wald test, such as ``doc://Science/documentation/Science/WaldTest/init(doesMeanEqual:)``." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">WaldTest</a></li><li>init(parameterEstimator:parameterValueUnderNullHypothesis:standardErrorEstimator:)</li></ul><hgroup><p>Initializer</p><h1>init(parameterEstimator:parameterValueUnderNullHypothesis:standardErrorEstimator:)</h1></hgroup><p>Creates any Wald test. There are convenience wrappers around this initializer for specific types of Wald test, such as <a href="../init(doesmeanequal:)/index.html"><code>init(doesMeanEqual:)</code></a>.</p><pre><code>init(parameterEstimator: @escaping (Sample) -> Double, parameterValueUnderNullHypothesis: Double, standardErrorEstimator: @escaping (Sample) -> Double)</code></pre></section><h2>Parameters</h2><dl><dt>parameterEstimator</dt><dd><p>A function that estimates the parameter of interest from a data sample. For example: if the parameter of interest is the population mean, the <code>parameterEstimator</code> is the sample-mean function.</p></dd><dt>parameterValueUnderNullHypothesis</dt><dd><p>The value of the parameter of interest under the null hypothesis. Usually 0.</p></dd><dt>standardErrorEstimator</dt><dd><p>A function that estimates the standard error of <code>parameterEstimator</code> from a data sample.</p></dd></dl><h2>Discussion</h2><p>This creates a Wald test for the null hypothesis 𝜃 = <code>parameterValueUnderNullHypothesis</code> where 𝜃 is the parameter of interest.</p></article></noscript><div id="app"></div></body></html>
