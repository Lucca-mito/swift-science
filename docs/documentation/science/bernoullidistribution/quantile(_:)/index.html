<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>quantile(_:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The distribution’s quantile function." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">BernoulliDistribution</a></li><li>quantile(_:)</li></ul><hgroup><p>Instance Method</p><h1>quantile(_:)</h1></hgroup><p>The distribution’s <a href="https://en.wikipedia.org/wiki/Quantile_function">quantile function</a>.</p><pre><code>func quantile(_ quantileFraction: Statistic) -> Value</code></pre></section><h2>Parameters</h2><dl><dt>quantileFraction</dt><dd><p>A probability.</p></dd></dl><h2>Return Value</h2><p>The smallest <a href="../../probabilitydistribution/value/index.html"><code>Value</code></a> <code>x</code> such that <code>probability(ofAtMost: x) ≥ quantileFraction</code>.</p><h2>Discussion</h2><p>If the distribution’s cumulative density function is strictly increasing, then <code>quantile(p)</code> is the unique <a href="../../probabilitydistribution/value/index.html"><code>Value</code></a> <code>x</code> such that <code>probability(ofAtMost: x) == quantileFraction</code>.</p><aside class="see"><p class="label">See</p><p><a href="../../probabilitydistribution/probability(ofatmost:)/index.html"><code>probability(ofAtMost:)</code></a></p></aside></article></noscript><div id="app"></div></body></html>
