<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>isSymmetric</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Whether the distribution is symmetric." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">BernoulliDistribution</a></li><li>isSymmetric</li></ul><hgroup><p>Instance Property</p><h1>isSymmetric</h1></hgroup><p>Whether the distribution is symmetric.</p><pre><code>var isSymmetric: Bool { get }</code></pre></section><h2>Discussion</h2><p>For example, every <a href="../../normaldistribution/index.html"><code>NormalDistribution</code></a> is symmetric about its <a href="../../distributionwithmean/mean/index.html"><code>mean</code></a> value.</p><p>The distribution does not necessarily have to be symmetric about a <i>valid</i> <code>Value</code> for <code>isSymmetric</code> to be true. For example, <code>BernoulliDistribution(probabilityOfOne: 0.5)</code> is symmetric about the <code>Value</code> 0.5 even though 0.5 is not a valid <code>Value</code> for that distribution.</p></article></noscript><div id="app"></div></body></html>
