<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>Euclidean</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A type whose distance between values is the length of the line segment between them." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>Euclidean</li></ul><hgroup><p>Protocol</p><h1>Euclidean</h1></hgroup><p>A type whose distance between values is the length of the line segment between them.</p><pre><code>protocol Euclidean : MetricSpace</code></pre></section><h2>Example</h2><pre class="swift"><code>let sqDist: Double = Complex.squaredDistance(between: .i, and: 1)
print(sqDist.isApproximatelyEqual(to: 2)) // true
</code></pre><h2>Conforming to the Euclidean protocol</h2><p>Types conforming to <code>Euclidean</code> must implement a <a href="../metricspace/distance(between:and:)/index.html"><code>distance(between:and:)</code></a> function that is equivalent to the <a href="https://en.wikipedia.org/wiki/Euclidean_distance">Euclidean distance</a> function.</p><p><code>Euclidean</code> also defines a <a href="squareddistance(between:and:)/index.html"><code>squaredDistance(between:and:)</code></a> function with a default implementation that simply squares the result of  <a href="../metricspace/distance(between:and:)/index.html"><code>distance(between:and:)</code></a>. Conforming types are encouraged to override this implementation if they have a better one, such as an implementation that is more numerically stable.</p><h2>Topics</h2><h3>Type Methods</h3><ul><li><a href="squareddistance(between:and:)/index.html"><code>static func squaredDistance(between: Self, and: Self) -> Self.Stride</code></a><p>The square of the distance between two values.</p></li></ul><h2>Relationships</h2><h3>Conforming Types</h3><ul><li><a href="../swift/uint32/index.html"><code>UInt32</code></a></li><li><a href="../swift/int16/index.html"><code>Int16</code></a></li><li><a href="../complexmodule/complex/index.html"><code>Complex</code></a></li><li><a href="../swift/int/index.html"><code>Int</code></a></li><li><a href="../swift/int64/index.html"><code>Int64</code></a></li><li><a href="../swift/uint/index.html"><code>UInt</code></a></li><li><a href="../swift/uint8/index.html"><code>UInt8</code></a></li><li><a href="../swift/float/index.html"><code>Float</code></a></li><li><a href="../swift/int8/index.html"><code>Int8</code></a></li><li><a href="../swift/double/index.html"><code>Double</code></a></li><li><a href="../swift/uint16/index.html"><code>UInt16</code></a></li><li><a href="../swift/uint64/index.html"><code>UInt64</code></a></li><li><a href="../swift/int32/index.html"><code>Int32</code></a></li></ul><h3>Inherits From</h3><ul><li><a href="../metricspace/index.html"><code>MetricSpace</code></a></li></ul></article></noscript><div id="app"></div></body></html>
