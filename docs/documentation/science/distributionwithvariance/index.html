<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>DistributionWithVariance</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A probability distribution that always has a variance and a standard deviation." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>DistributionWithVariance</li></ul><hgroup><p>Protocol</p><h1>DistributionWithVariance</h1></hgroup><p>A probability distribution that always has a variance and a standard deviation.</p><pre><code>protocol DistributionWithVariance : DistributionWithMean</code></pre></section><h2>Overview</h2><p>Every probability distribution with a <i>p</i>th <a href="https://en.wikipedia.org/wiki/Moment_(mathematics)#Notable_moments">moment</a> has a <i>(p+1)</i> th moment. As a consequence, every <code>DistributionWithVariance</code> is also a <a href="../distributionwithmean/index.html"><code>DistributionWithMean</code></a>. However, the converse is not true: some probability distributions have a mean but don’t have a variance.</p><h2>Topics</h2><h3>Instance Properties</h3><ul><li><a href="standarddeviation/index.html"><code>var standardDeviation: Self.Statistic</code></a></li><li><a href="variance/index.html"><code>var variance: Self.Statistic</code></a><p>The variance of the distribution.</p></li></ul><h2>Relationships</h2><h3>Conforming Types</h3><ul><li><a href="../bernoullidistribution/index.html"><code>BernoulliDistribution</code></a></li><li><a href="../exponentialdistribution/index.html"><code>ExponentialDistribution</code></a></li><li><a href="../poissondistribution/index.html"><code>PoissonDistribution</code></a></li><li><a href="../normaldistribution/index.html"><code>NormalDistribution</code></a></li></ul><h3>Inherits From</h3><ul><li><a href="../probabilitydistribution/index.html"><code>ProbabilityDistribution</code></a></li><li><a href="../distributionwithmean/index.html"><code>DistributionWithMean</code></a></li></ul><h3>Inherited By</h3><ul><li><a href="../distributionwithmoments/index.html"><code>DistributionWithMoments</code></a></li><li><a href="../boundeddiscretedistribution/index.html"><code>BoundedDiscreteDistribution</code></a></li></ul></article></noscript><div id="app"></div></body></html>
