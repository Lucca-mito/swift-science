<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>sampleVariance()</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The sample variance of the collection." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../../index.html">Swift Science</a></li><li><a href="../../index.html">Swift</a></li><li><a href="../index.html">Collection</a></li><li>sampleVariance()</li></ul><hgroup><p>Instance Method</p><h1>sampleVariance()</h1></hgroup><p>The sample variance of the collection.</p><pre><code>func sampleVariance() -> Self.Element.Stride</code></pre></section><h2>Return Value</h2><p>The sample variance: $$\frac{1}{n-1} \sum_{i=1}^n \lVert x_i - \mu\rVert^2$$ where $n$ is the collection’s <code>count</code> and $\lVert x_i - \mu\rVert$ is the <a href="../../../euclidean/index.html"><code>Euclidean</code></a> distance from each element $x_i$ to the sample mean $\mu$.</p><h2>Discussion</h2><aside class="precondition"><p class="label">Precondition</p><p>There must be at least two elements in the collection.</p></aside><p>The sample variance is similar to the population variance, but with $n - 1$ in the denominator instead of $n$ (where $n$ is the size of the collection). As a result,</p><ol><li><p>The sample variance is always slightly greater than the population variance.</p></li><li><p>The sample variance better estimates the variance of the population (or the <a href="../../../probabilitydistribution/index.html"><code>ProbabilityDistribution</code></a>) from which the values were sampled.</p></li></ol><aside class="see"><p class="label">See</p><p><a href="https://en.wikipedia.org/wiki/Variance#Population_variance_and_sample_variance">Population variance and sample variance</a>.</p></aside></article></noscript><div id="app"></div></body></html>
