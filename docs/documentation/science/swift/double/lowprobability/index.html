<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>lowProbability</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A probability of Type I Error that is commonly accepted as being low." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../../index.html">Swift Science</a></li><li><a href="../../index.html">Swift</a></li><li><a href="../index.html">Double</a></li><li>lowProbability</li></ul><hgroup><p>Type Property</p><h1>lowProbability</h1></hgroup><p>A probability of Type I Error that is commonly accepted as being low.</p><pre><code>static let lowProbability: ProbabilityOfTypeIError</code></pre></section><h2>Discussion</h2><p>Corresponds to a probability of 𝛼 = 0.05. A hypothesis test at this level is conservative about rejecting the null hypothesis. So, if it <i>does</i> reject the null hypothesis anyway, there is strong evidence against the null hypothesis.</p></article></noscript><div id="app"></div></body></html>
