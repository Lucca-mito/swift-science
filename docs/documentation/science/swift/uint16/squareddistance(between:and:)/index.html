<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>squaredDistance(between:and:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The square of the distance between two values." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../../index.html">Swift Science</a></li><li><a href="../../index.html">Swift</a></li><li><a href="../index.html">UInt16</a></li><li>squaredDistance(between:and:)</li></ul><hgroup><p>Type Method</p><h1>squaredDistance(between:and:)</h1></hgroup><p>The square of the distance between two values.</p><pre><code>static func squaredDistance(between lhs: Self, and rhs: Self) -> Self.Stride</code></pre></section><h2>Return Value</h2><p>The <a href="https://en.wikipedia.org/wiki/Euclidean_distance#Squared_Euclidean_distance">squared Euclidean distance</a> between <code>lhs</code> and <code>rhs</code>.</p><h2>Discussion</h2><p>This function is used to define the population variance and the sample variance, but it’s also useful by itself. For example, the squared Euclidean distance is used in the method of <a href="https://en.wikipedia.org/wiki/Least_squares">least squares</a>.</p></article></noscript><div id="app"></div></body></html>
