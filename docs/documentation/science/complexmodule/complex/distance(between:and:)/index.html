<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>distance(between:and:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Returns the distance between two values, expressed as a ``doc://Science/documentation/Science/ComplexModule/Complex/Stride``." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../../index.html">Swift Science</a></li><li><a href="../../index.html">ComplexModule</a></li><li><a href="../index.html">Complex</a></li><li>distance(between:and:)</li></ul><hgroup><p>Type Method</p><h1>distance(between:and:)</h1></hgroup><p>Returns the distance between two values, expressed as a <a href="../stride/index.html"><code>Complex.Stride</code></a>.</p><pre><code>static func distance(between lhs: Complex&lt;RealType>, and rhs: Complex&lt;RealType>) -> RealType</code></pre></section><h2>Return Value</h2><p>The distance between <code>lhs</code> and <code>rhs</code>.</p><h2>Discussion</h2><p>This function must satisfy the four <a href="https://en.wikipedia.org/wiki/Metric_space">metric space</a> laws:</p><ol><li><p>The distance from a point to itself is zero.</p></li></ol><pre class="swift"><code>.distance(between: x, and: x) == .zero
</code></pre><ol><li><p>The distance between two distinct points is always positive.</p></li></ol><pre class="swift"><code>// x != y
.distance(between: x, and: y) > .zero
</code></pre><ol><li><p>The distance from <i>x</i> to <i>y</i> is always the same as the distance from <i>y</i> to <i>x</i>.</p></li></ol><pre class="swift"><code>.distance(between: x, and: y) == .distance(between: y, and: x)
</code></pre><ol><li><p>The <a href="https://en.wikipedia.org/wiki/Triangle_inequality">triangle inequality</a> holds:</p></li></ol><pre class="swift"><code>.distance(between: x, and: z) &lt;= .distance(between: x, and: y) + .distance(between: y, and: z)
</code></pre></article></noscript><div id="app"></div></body></html>
