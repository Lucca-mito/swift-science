<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>Unimodal</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A probability distribution that always has a single mode." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>Unimodal</li></ul><hgroup><p>Protocol</p><h1>Unimodal</h1></hgroup><p>A probability distribution that always has a single mode.</p><pre><code>protocol Unimodal : FiniteModal</code></pre></section><h2>Overview</h2><p>For example, <a href="../normaldistribution/index.html"><code>NormalDistribution</code></a> conforms to <code>Unimodal</code> because it always has  a unique <a href="mode/index.html"><code>mode</code></a>: its <a href="../normaldistribution/mean/index.html"><code>mean</code></a>. In contrast, <a href="../bernoullidistribution/index.html"><code>BernoulliDistribution</code></a> does not conform to <code>Unimodal</code> because, although the mode of a Bernoulli distribution is almost always unique, the mode is not unique when <a href="../bernoullidistribution/probabilityofone/index.html"><code>probabilityOfOne</code></a> = <a href="../bernoullidistribution/probabilityofzero/index.html"><code>probabilityOfZero</code></a> = 0.5.</p><h2>Topics</h2><h3>Instance Properties</h3><ul><li><a href="mode/index.html"><code>var mode: Self.Value</code></a><p>The unique <a href="../probabilitydistribution/value/index.html"><code>Value</code></a> that is the most likely to be sampled from the distribution.</p></li></ul><h2>Relationships</h2><h3>Inherits From</h3><ul><li><a href="../finitemodal/index.html"><code>FiniteModal</code></a></li><li><a href="../probabilitydistribution/index.html"><code>ProbabilityDistribution</code></a></li></ul><h3>Conforming Types</h3><ul><li><a href="../normaldistribution/index.html"><code>NormalDistribution</code></a></li><li><a href="../exponentialdistribution/index.html"><code>ExponentialDistribution</code></a></li></ul></article></noscript><div id="app"></div></body></html>
