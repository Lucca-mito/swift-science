<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>BoundedDiscreteDistribution</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="A probability distribution over a finite set of values." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>BoundedDiscreteDistribution</li></ul><hgroup><p>Protocol</p><h1>BoundedDiscreteDistribution</h1></hgroup><p>A probability distribution over a finite set of values.</p><pre><code>protocol BoundedDiscreteDistribution : BoundedDistribution, ClosedFormQuantile, DiscreteDistribution, DistributionWithMoments</code></pre></section><h2>Overview</h2><p>Such a distribution always has a <a href="../distributionwithmean/mean/index.html"><code>mean</code></a>, a <a href="../distributionwithvariance/variance/index.html"><code>variance</code></a>, and all other moments. Additionally, a <code>BoundedDiscreteDistribution</code> always has a <a href="../closedformquantile/index.html"><code>ClosedFormQuantile</code></a>.</p><h2>Topics</h2><h3>Instance Properties</h3><ul><li><a href="support/index.html"><code>var support: Set&lt;Self.Value></code></a><p>The finite set of values that have a positive probability of being sampled from this specific probability distribution.</p></li></ul><h3>Type Properties</h3><ul><li><a href="domain/index.html"><code>static var domain: Set&lt;Self.Value></code></a><p>The finite set of values that may have a positive probability of being sampled in this family of probability distributions.</p></li></ul><h2>Relationships</h2><h3>Inherits From</h3><ul><li><a href="../discretedistribution/index.html"><code>DiscreteDistribution</code></a></li><li><a href="../finitemodal/index.html"><code>FiniteModal</code></a></li><li><a href="../boundeddistribution/index.html"><code>BoundedDistribution</code></a></li><li><a href="../distributionwithmean/index.html"><code>DistributionWithMean</code></a></li><li><a href="../closedformquantile/index.html"><code>ClosedFormQuantile</code></a></li><li><a href="../probabilitydistribution/index.html"><code>ProbabilityDistribution</code></a></li><li><a href="../distributionwithmoments/index.html"><code>DistributionWithMoments</code></a></li><li><a href="../closedformmedian/index.html"><code>ClosedFormMedian</code></a></li><li><a href="../lowerboundeddistribution/index.html"><code>LowerBoundedDistribution</code></a></li><li><a href="../distributionwithvariance/index.html"><code>DistributionWithVariance</code></a></li></ul><h3>Conforming Types</h3><ul><li><a href="../bernoullidistribution/index.html"><code>BernoulliDistribution</code></a></li></ul></article></noscript><div id="app"></div></body></html>
