<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>domain</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="The finite set of values that may have a positive probability of being sampled in this family of probability distributions." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Swift Science</a></li><li><a href="../index.html">BoundedDiscreteDistribution</a></li><li>domain</li></ul><hgroup><p>Type Property</p><h1>domain</h1></hgroup><p>The finite set of values that may have a positive probability of being sampled in this family of probability distributions.</p><pre><code>static var domain: Set&lt;Self.Value> { get }</code></pre></section><h2>Discussion</h2><p>For example, <code>BernoulliDistribution.domain</code> is <code>[0, 1]</code> because 0 and 1 are the only values that can be sampled from a Bernoulli distribution, even though:</p><ul><li><p>It is impossible to sample 1 from <code>BernoulliDistribution(probabilityOfOne: 0)</code>.</p></li><li><p>It is impossible to sample 0 from <code>BernoulliDistribution(probabilityOfOne: 1)</code>.</p></li></ul><aside class="see also"><p class="label">See also</p><p><a href="../support/index.html"><code>support</code></a></p></aside></article></noscript><div id="app"></div></body></html>
