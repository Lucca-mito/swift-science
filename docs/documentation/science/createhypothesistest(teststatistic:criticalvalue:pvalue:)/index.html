<!doctype html><html lang="en-US" class="no-js"><head><base href="/swift-science/"><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/swift-science/favicon.ico"><link rel="mask-icon" href="/swift-science/favicon.svg" color="#333333"><title>createHypothesisTest(testStatistic:criticalValue:pValue:)</title><script defer="defer" src="/swift-science/js/chunk-vendors.8bb66478.js"></script><script defer="defer" src="/swift-science/js/index.56468971.js"></script><link href="/swift-science/css/index.1dd2e4e5.css" rel="stylesheet"><meta content="Creates a single custom ``doc://Science/documentation/Science/HypothesisTest`` without having to declare a new type." name="description"></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Swift Science</a></li><li>createHypothesisTest(testStatistic:criticalValue:pValue:)</li></ul><hgroup><p>Function</p><h1>createHypothesisTest(testStatistic:criticalValue:pValue:)</h1></hgroup><p>Creates a single custom <a href="../hypothesistest/index.html"><code>HypothesisTest</code></a> without having to declare a new type.</p><pre><code>func createHypothesisTest&lt;Sample>(testStatistic: @escaping (Sample) -> Double, criticalValue: @escaping (ProbabilityOfTypeIError, Sample) -> Double, pValue: @escaping (Sample) -> ProbabilityOfTypeIError) -> some HypothesisTest
</code></pre></section><h2>Parameters</h2><dl><dt>testStatistic</dt><dd><p>A function of the dataset that characterizes a type of hypothesis test. The test rejects the null hypothesis if <code>testStatistic(data)</code> exceeds the test’s critical value.</p></dd><dt>criticalValue</dt><dd><p>A function mapping the level (see <a href="../hypothesistest/test(on:atlevel:)/index.html"><code>test(on:atLevel:)</code></a>) and the sample data to the test’s critical value. If the test statistic exceeds this value, the null hypothesis is rejected. In some tests, such as the <a href="../waldtest/index.html"><code>WaldTest</code></a>, the <code>criticalValue</code> depends only on the level and ignores the sample data.</p></dd><dt>pValue</dt><dd><p>A function mapping the dataset to the reported p-value. <a href="../hypothesistest/pvalue(for:)/index.html"><code>pValue(for:)</code></a> wraps this closure.</p></dd></dl><h2>Discussion</h2><p>Use this function to create a custom single-purpose hypothesis test that doesn’t have test parameters. To create a custom <i>type</i> of hypothesis test, declare a structure conforming to <a href="../hypothesistest/index.html"><code>HypothesisTest</code></a> instead of using this function.</p></article></noscript><div id="app"></div></body></html>
